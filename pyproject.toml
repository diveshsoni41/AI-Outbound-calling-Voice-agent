[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-voice-agent"
version = "0.1.0"
description = "Outbound healthcare voice agent built on LiveKit Agents, with post-call analysis and Opik tracing."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "livekit-agents[openai,silero]==1.8.6",
    "livekit-api==1.2.1",
    "opik==2.2.96",
    "openai>=2.0,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "phonenumbers>=8.13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "external: needs real credentials or network services; skipped unless explicitly enabled",
]
addopts = "-m 'not external'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Uploaded to Opik's sandbox as-is; keep syntax compatible with older interpreters.
"app/observability/online_metrics/*" = ["UP"]
